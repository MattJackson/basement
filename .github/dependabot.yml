# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /docker
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  groups:
    all:
      patterns:
      - '*'
