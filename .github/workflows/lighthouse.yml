name: Lighthouse

# Run Lighthouse CI against a live deploy on every PR that touches
# the frontend. Thresholds live in .lighthouserc.json.
#
# Cycle v1.11.0.12 — this is the perf+a11y gate. The target base URL
# is supplied via the `LIGHTHOUSE_BASE_URL` repository variable (the
# PR builder doesn't host a previewable URL of its own yet). When the
# variable is unset the job no-ops, so forks and contributors without
# a deploy don't hit a hard failure. When PR-preview deploys land
# (future cycle), point this at the preview URL instead.

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Skip entirely unless a target base URL is configured as a repo
    # variable, so the job never hard-fails for forks without a deploy.
    if: ${{ vars.LIGHTHOUSE_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          urls: |
            ${{ vars.LIGHTHOUSE_BASE_URL }}/login
            ${{ vars.LIGHTHOUSE_BASE_URL }}/files
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true  # warn-mode until baseline scores are recorded
